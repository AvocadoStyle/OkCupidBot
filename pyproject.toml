[tool.poetry]
name = "okcupid-bot"
version = "0.1.0"
description = "OkCupid automation bot using Selenium"
authors = ["Your Name <your.email@example.com>"]
readme = "readme.md"
packages = [
    { include = "controller" },
    { include = "model" },
    { include = "data" },
]

[tool.poetry.dependencies]
python = "^3.9"
selenium = "4.2.0"
python-dotenv = "^1.2.1"
webdriver-manager = "^4.0.2"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
black = "^23.0.0"
flake8 = "^6.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
